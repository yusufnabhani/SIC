; Read automatically by PHP-FPM (e.g. Laravel Herd) for every request served from
; public/. Some dependencies (guzzlehttp/promises, symfony/translation, opis/closure,
; laravel/framework itself) trigger PHP 8.4 "implicitly nullable parameter" deprecation
; notices the moment they're autoloaded -- before Laravel's own error_reporting() call
; in HandleExceptions::bootstrap() ever runs, so that patch alone can't suppress them.
; This stops PHP from printing them to the response while leaving Laravel's own
; exception/debug pages (Whoops/Ignition) working normally, since those are rendered by
; Laravel's handler, not by display_errors.
display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
